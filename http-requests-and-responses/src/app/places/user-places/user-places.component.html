<app-places-container title="Your Favorite Places">
  @if (places()) {
    <app-places [places]="places()!" (selectPlace)="onDeletePlace($event)" />
  } @else if (places()?.length === 0) {
    <p class="fallback-text">Unfortunately, no favorite places could be found.</p>
  } @else if (isFetching() && !error()) {
    <p class="fallback-text">Fetching your favorite places, please wait...</p>
  } @else if (error()) {
    <p class="fallback-text">{{ error() }}</p>
  }
</app-places-container>
