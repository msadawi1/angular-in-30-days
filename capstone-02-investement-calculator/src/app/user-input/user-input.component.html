<form (ngSubmit)="onCalculate()">
  <div class="input-group">
    <p>
      <label for="initial-investement">Initial Investement</label>
      <input type="number" id="initial-investement" name="initial-investement" [(ngModel)]="initialInvestement" />
    </p>
    <p>
      <label for="annual-investement">Annual Investement</label>
      <input type="number" id="annual-investement" name="annual-investement" [(ngModel)]="annualInvestement"/>
    </p>
  </div>

  <div class="input-group">
    <p>
      <label for="expected-return">Expected Return</label>
      <input type="number" id="expected-return" name="expected-return" [(ngModel)]="expectedReturn"/>
    </p>
    <p>
      <label for="duration">Duration</label>
      <input type="number" id="duration" name="duration" [(ngModel)]="duration"/>
    </p>
  </div>

  <p>
    <button type="submit">Calculate</button>
  </p>
</form>
