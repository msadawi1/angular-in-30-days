<main class="flex flex-col gap-2 mx-8 my-4">
  <div class="flex gap-5">
    <div class="flex-1">
      <input class="min-w-full pl-2 py-1 border-2 border-gray-800"
      placeholder="Task title.." [(ngModel)]="input" type="text">
    </div>
    <div class="flex-none">
      <button class="hover:cursor-pointer p-1 min-w-2xs bg-green-400 border-gray-800 border-2" (click)="onAdd()">
        Add
      </button>
    </div>
  </div>

  <div class="flex justify-between items-center">
    <div class="flex gap-5">
      <span class="text-xl">Total: {{ total }}</span>
      <span class="text-xl">Remaining: {{ remaining }}</span>
    </div>
    <div>
      <button class="hover:cursor-pointer p-1 min-w-2xs bg-blue-600 text-white border-gray-800 border-2" (click)="onHideCompleted()">
        Hide Completed
      </button>
    </div>
  </div>

  <ul>
    @for (task of tasks; track $index) {
      <li class="flex gap-1" [ngClass]="{'hidden': isCompletedHidden && task.completed}">
        <input type="checkbox" [(ngModel)]="task.completed">
        <span class="text-lg {{priorityToClass[task.priority]}}" [ngClass]="{'line-through text-gray-400': task.completed}">{{ task.title }}</span>
      </li>
    } @empty {
      <span class="text-lg">No tasks available</span>
    }
  </ul>

</main>
