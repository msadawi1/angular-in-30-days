<div>
  <span>
    <a routerLink="">Silah</a>
  </span>
  <ul>
    @for (route of routes; track $index) {
      @if (!route.redirectTo && route.path !== '**') {
        <li>
          <a [class.selected]="currentRouteUrl === '/' + route.path" [routerLink]="route.path">
            {{ route.data!['navLabel'] }}
          </a>
        </li>
      }
    }
  </ul>
  <button>
    <span>+</span>
    Add Person
  </button>
</div>
