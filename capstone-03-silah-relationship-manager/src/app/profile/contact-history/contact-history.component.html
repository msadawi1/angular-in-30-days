<app-card>
  <ol class="timeline">
    @for (log of contactLogs(); track log.id) {
      <li>
        <div class="entry-header">
          <span class="way">{{ log.type | logTypeLabel }}</span>
          <span class="entry-date">{{ log.date | date: 'longDate' }}</span>
        </div>
        <p class="entry-note">{{ log.notes ?? 'No notes recorded.' }}</p>
      </li>
    } @empty {
      <p style="margin: 0; color: var(--color-ink-muted);">
        You have not contacted this person yet.
      </p>
    }
  </ol>
</app-card>
