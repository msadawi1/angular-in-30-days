@if (person(); as person) {
  <span>
    <a class="back-link" routerLink="/people">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m15 18-6-6 6-6" />
      </svg>
      Back
    </a>
    <h2>{{ person.name }}</h2>
  </span>

  <section class="overview">
    <app-profile-overview [person]="person" />
  </section>
} @else {
  <p>Loading...</p>
}

<section class="history">
  <h4>Contact history</h4>
  @if (contactLogs(); as contactLogs) {
    <app-contact-history [contactLogs]="contactLogs" />
  } @else {
    <p>Loading...</p>
  }
</section>

<section class="controls">
  <app-card>
    <div class="actions">
      <span class="field-label">Actions</span>
      <button class="action danger" type="button" (click)="toggleDialog()">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 6h18" />
          <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" />
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
        </svg>
        Delete permanently
      </button>
    </div>
  </app-card>
</section>

@if (isDialogVisible()) {
  <dialog id="confirm-delete" #confirmDialog (click)="onBackdropClick($event)" (close)="onNativeClose()">
    <h2>Remove {{ person()?.name }}?</h2>
    <p>This action can't be undone.</p>
    <button class="dialog-btn cancel" (click)="toggleDialog()">Cancel</button>
    <button class="dialog-btn confirm" (click)="onDelete()">Delete</button>
  </dialog>
}
