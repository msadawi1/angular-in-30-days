<app-card>
    <div class="summary">
      <div class="summary-header">
        <div class="chips">
          <span class="chip relationship">Immediate Family</span>
          <span class="chip status">Overdue</span>
        </div>
        <button class="icon-button" type="button" aria-label="Edit person">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
          </svg>
        </button>
      </div>

      <div class="contact-info">
        <span class="contact-method phone">
          <span class="contact-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"
              />
            </svg>
          </span>
          <a href="tel:+15551234567">+1 (555) 234-7890</a>
        </span>
        <span class="contact-method email">
          <span class="contact-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="2" y="4" width="20" height="16" rx="2" />
              <path d="m22 7-10 6L2 7" />
            </svg>
          </span>
          <a href="mailto:sadawe@gmai.com">fatima.hassan&#64;gmail.com</a>
        </span>
      </div>

      <div class="contact-overview">
        <div class="overview-item">
          <span class="field-label">Last contact</span>
          <span class="field-value">{{ person().lastContactDate | daysSince }}</span>
          @if (person().lastContactDate; as lastContactDate) {
            <span class="field-note">{{ lastContactDate | date: 'longDate' }}</span>
          }
        </div>

        <div class="overview-item">
          <span class="field-label">Cadence</span>
          <span class="field-value">every 7 days</span>
          <span class="field-note">Follows the Immediate Family default</span>
        </div>
      </div>
    </div>
  </app-card>

<button class="log-contact" type="button">
  <span class="plus">+</span>
  Log a contact
</button>

<app-notes />

<app-important-dates />
