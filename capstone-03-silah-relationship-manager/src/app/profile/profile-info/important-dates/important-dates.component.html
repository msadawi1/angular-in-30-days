<app-card variant="flush">
  <div class="important-dates">
    <span class="field-label">Important dates</span>
    <ul>
      @for (date of dates(); track date.id) {
        <li>
          <span>{{ date.label }}</span>
          <span class="date">{{ date.date | date: 'MMMM d' }}</span>
        </li>
      } @empty {
        <span class="no-dates">No important dates recorded for this person.</span>
      }
    </ul>
  </div>
</app-card>
