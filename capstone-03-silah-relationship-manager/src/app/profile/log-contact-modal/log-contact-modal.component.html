<dialog #dialog (cancel)="onHide()" (click)="onBackdropClick($event)">
  <form [formGroup]="form" class="container" (ngSubmit)="onSubmit()">
    <div class="header">
      <h4>Log contact with Fatima Al-Hassan</h4>
      <button class="close-btn" type="button" aria-label="Close" (click)="onHide()">X</button>
    </div>

    <div class="contact-method">
      <p>How did you connect?</p>
      <div class="options">
        <div class="method-option">
          <label for="contact1">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"
              ></path>
            </svg>
            <span>{{ 'call' | logTypeLabel }}</span>
          </label>
          <input type="radio" id="contact1" value="call" formControlName="method" />
        </div>
        <div class="method-option">
          <label for="contact2">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>{{ 'visit' | logTypeLabel }}</span>
          </label>
          <input
            type="radio"
            id="contact2"
            value="visit"
            formControlName="method"
          />
        </div>
        <div class="method-option">
          <label for="contact3">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <span>{{ 'message' | logTypeLabel }}</span>
          </label>
          <input
            type="radio"
            id="contact3"
            value="message"
            formControlName="method"
          />
        </div>
        <div class="method-option">
          <label for="contact4">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="9"></circle>
            </svg>
            <span>{{ 'other' | logTypeLabel }}</span>
          </label>
          <input
            type="radio"
            id="contact4"
            value="other"
            formControlName="method"
          />
        </div>
      </div>
    </div>

    <div class="contact-date">
      <p>When?</p>
      <input type="date" id="date" name="date" formControlName="date" />
    </div>

    <div class="contact-notes">
      <p>Notes (optional)</p>
      <textarea
        name="notes"
        id="notes"
        rows="2"
        placeholder="What did you talk about?"
        formControlName="notes"
      >
      </textarea>
    </div>

    <div class="controls">
      <button class="cancel-btn" type="button" (click)="onHide()">Cancel</button>
      <button class="save-btn" type="submit">Save</button>
    </div>
  </form>
</dialog>
