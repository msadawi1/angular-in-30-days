<form id="new-ticket" (ngSubmit)="onSubmit(title.value, request.value)" #form>
  <app-control class="control" label="Title">
    <input name="title" id="title" type="text" #title />
  </app-control>
  <app-control class="control" label="Request">
    <textarea name="request" id="request" type="text" rows="3" #request></textarea>
  </app-control>
  <p>
    <button appButton>
      Submit
      <span ngProjectAs="icon">></span>
    </button>
  </p>
</form>
